<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Joint Picker — media stack</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #101216; color: #e6e8ec;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #wrap { display: flex; height: 100%; }
  #side { width: 320px; flex: 0 0 320px; padding: 14px; overflow-y: auto;
    background: #171a20; border-right: 1px solid #262b33; }
  #view { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; }
  h1 { font-size: 14px; margin: 0 0 4px; letter-spacing: .02em; }
  .sub { color: #8b93a1; font-size: 11.5px; margin-bottom: 12px; }
  .group { margin: 12px 0 6px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .08em; color: #7f8797; }
  button { font: inherit; cursor: pointer; border-radius: 7px; border: 1px solid #2f3640;
    background: #1e232b; color: #dfe3ea; padding: 7px 10px; }
  button:hover { border-color: #46505e; background: #242a33; }
  button.primary { background: #2b6cff; border-color: #2b6cff; color: #fff; }
  button.primary:hover { background: #3a78ff; }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row button { flex: 1; }
  .joint { display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    border-radius: 7px; cursor: pointer; border: 1px solid transparent; }
  .joint:hover { background: #1e232b; }
  .joint.armed { background: #22304d; border-color: #3d5fa8; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #3a4150;
    flex: 0 0 9px; }
  .joint.set .dot { background: #38d17a; }
  .joint.armed .dot { background: #ffd166; }
  .name { flex: 1; }
  .val { color: #7f8797; font-size: 11px; font-variant-numeric: tabular-nums; }
  #status { margin-top: 12px; font-size: 11.5px; color: #8b93a1; white-space: pre-wrap; }
  #hint { position: absolute; left: 14px; bottom: 12px; font-size: 11.5px;
    color: #9aa3b2; background: #0c0e12cc; padding: 6px 10px; border-radius: 7px; }
  #log { max-height: 160px; overflow: auto; background: #0d1014; border: 1px solid #232830;
    border-radius: 7px; padding: 8px; font: 11px/1.4 ui-monospace, monospace;
    color: #9aa3b2; white-space: pre-wrap; margin-top: 8px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="side">
    <h1>Joint picker</h1>
    <div class="sub">Click a joint, then click the model where it belongs.
      Click sets and auto-advances.</div>

    <div class="group">Body</div>
    <div id="body-joints"></div>
    <div class="group">Legs</div>
    <div id="leg-joints"></div>

    <div class="row">
      <button id="save">Save joints</button>
      <button id="build" class="primary" disabled>Build rig</button>
    </div>
    <div class="row">
      <button id="undo">Undo last</button>
      <button id="clear">Clear all</button>
    </div>
    <div id="status">loading…</div>
    <div id="log" hidden></div>
  </div>
  <div id="view"><div id="hint">drag = orbit · scroll = zoom · right-drag = pan</div></div>
</div>

<script type="module">
import * as THREE from './vendor/three.module.js';
import { GLTFLoader } from './vendor/GLTFLoader.js';
import { OrbitControls } from './vendor/OrbitControls.js';

// Order matters: this is the sequence I walk through when picking.
const JOINTS = [
  ['neck',      'Neck / base of head',        'body'],
  ['head',      'Snout tip',                  'body'],
  ['spine',     'Mid-back (spine centre)',    'body'],
  ['hips',      'Rear centre (rump)',         'body'],
  ['FL_hip',    'Front left — shoulder',      'leg'],
  ['FL_knee',   'Front left — knee',          'leg'],
  ['FL_hoof',   'Front left — hoof',          'leg'],
  ['FR_hip',    'Front right — shoulder',     'leg'],
  ['FR_knee',   'Front right — knee',         'leg'],
  ['FR_hoof',   'Front right — hoof',         'leg'],
  ['BL_hip',    'Back left — hip',            'leg'],
  ['BL_knee',   'Back left — knee',           'leg'],
  ['BL_hoof',   'Back left — hoof',           'leg'],
  ['BR_hip',    'Back right — hip',           'leg'],
  ['BR_knee',   'Back right — knee',          'leg'],
  ['BR_hoof',   'Back right — hoof',          'leg'],
];

const state = {};       // name -> {x,y,z} in the GLB's own coordinates
let armed = null;
const markers = new Map();

const view = document.getElementById('view');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const buildBtn = document.getElementById('build');

// ── scene ───────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14171c);
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 200);
camera.position.set(2.4, 1.6, 2.6);
const renderer = new THREE.WebGLRenderer({ antialias: true });
view.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2f38, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(3, 6, 4);
scene.add(key);
const grid = new THREE.GridHelper(6, 12, 0x2a2f38, 0x1e232b);
scene.add(grid);

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);

// ── model ───────────────────────────────────────────────────────────────
let model = null;
const loader = new GLTFLoader();
loader.load('./pig.glb', (gltf) => {
  model = gltf.scene;
  // Deliberately NOT re-centred: raycast points must stay in the GLB's own
  // coordinate space so Blender can use them directly after its Y-up -> Z-up swap.
  scene.add(model);

  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const c = box.getCenter(new THREE.Vector3());
  const d = Math.max(size.x, size.y, size.z);
  camera.position.set(c.x + d * 1.5, c.y + d * 0.9, c.z + d * 1.5);
  controls.target.copy(c);
  camera.near = d / 100; camera.far = d * 50;
  camera.updateProjectionMatrix();
  controls.update();
  grid.position.y = box.min.y;
  grid.scale.setScalar(Math.max(1, d / 2));
  statusEl.textContent = `model loaded · ${Math.round(size.x*100)/100} × ${Math.round(size.y*100)/100} × ${Math.round(size.z*100)/100}`;
  renderList();
}, undefined, (e) => {
  statusEl.textContent = 'failed to load ./pig.glb: ' + (e?.message || e);
});

// ── joint list UI ───────────────────────────────────────────────────────
function renderList() {
  const bodyEl = document.getElementById('body-joints');
  const legEl = document.getElementById('leg-joints');
  bodyEl.innerHTML = '';
  legEl.innerHTML = '';
  for (const [name, label, kind] of JOINTS) {
    const el = document.createElement('div');
    el.className = 'joint' + (state[name] ? ' set' : '') + (armed === name ? ' armed' : '');
    el.dataset.name = name;
    const p = state[name];
    el.innerHTML = `<span class="dot"></span><span class="name">${label}</span>`
      + `<span class="val">${p ? [p.x, p.y, p.z].map(v => v.toFixed(2)).join(', ') : '—'}</span>`;
    el.onclick = () => { armed = armed === name ? null : name; renderList(); updateHint(); };
    (kind === 'body' ? bodyEl : legEl).appendChild(el);
  }
  const all = JOINTS.every(([n]) => state[n]);
  buildBtn.disabled = !all;
  document.getElementById('save').disabled = Object.keys(state).length === 0;
}

function updateHint() {
  const h = document.getElementById('hint');
  h.textContent = armed
    ? `placing: ${armed} — click the model`
    : 'drag = orbit · scroll = zoom · right-drag = pan';
}

// ── picking ─────────────────────────────────────────────────────────────
const ray = new THREE.Raycaster();
ray.params.Points = { threshold: 0.01 };
const ndc = new THREE.Vector2();
let downAt = null;

renderer.domElement.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!armed || !model) return;
  if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 4) return; // was a drag
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(model, true);
  if (!hits.length) { statusEl.textContent = 'missed the model — click on its surface'; return; }

  // Convert the hit into the model's local space.
  const p = model.worldToLocal(hits[0].point.clone());
  state[armed] = { x: +p.x.toFixed(4), y: +p.y.toFixed(4), z: +p.z.toFixed(4) };
  placeMarker(armed, hits[0].point.clone());
  advance();
  renderList();
  updateHint();
});

function advance() {
  const idx = JOINTS.findIndex(([n]) => n === armed);
  for (let i = 1; i <= JOINTS.length; i++) {
    const [n] = JOINTS[(idx + i) % JOINTS.length];
    if (!state[n]) { armed = n; return; }
  }
  armed = null;
  statusEl.textContent = 'all joints placed — save, then build';
}

// ── markers ─────────────────────────────────────────────────────────────
const markerGeo = new THREE.SphereGeometry(1, 12, 10);
function placeMarker(name, worldPoint) {
  let m = markers.get(name);
  if (!m) {
    m = new THREE.Mesh(markerGeo,
      new THREE.MeshBasicMaterial({ color: 0xffd166, depthTest: false }));
    m.renderOrder = 999;
    m.userData.joint = name;
    scene.add(m);
    markers.set(name, m);
  }
  const scale = Math.max(0.012, orbitScale() * 0.018);
  m.scale.setScalar(scale);
  m.position.copy(worldPoint);
}
function orbitScale() {
  if (!model) return 1;
  const b = new THREE.Box3().setFromObject(model);
  const s = b.getSize(new THREE.Vector3());
  return Math.max(s.x, s.y, s.z);
}
function refreshMarkers() {
  if (!model) return;
  for (const [name, p] of Object.entries(state)) {
    placeMarker(name, model.localToWorld(new THREE.Vector3(p.x, p.y, p.z)));
  }
}
function dropMarker(name) {
  const m = markers.get(name);
  if (m) { scene.remove(m); markers.delete(name); }
}

// ── actions ─────────────────────────────────────────────────────────────
document.getElementById('undo').onclick = () => {
  const names = JOINTS.map(([n]) => n).filter(n => state[n]);
  if (!names.length) return;
  const last = names[names.length - 1];
  delete state[last];
  dropMarker(last);
  armed = last;
  renderList(); updateHint();
};

document.getElementById('clear').onclick = () => {
  for (const n of Object.keys(state)) dropMarker(n);
  for (const k of Object.keys(state)) delete state[k];
  armed = JOINTS[0][0];
  renderList(); updateHint();
};

document.getElementById('save').onclick = async () => {
  statusEl.textContent = 'saving…';
  try {
    const r = await fetch('/api/rig/joints', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ joints: state }),
    });
    const j = await r.json();
    statusEl.textContent = j.ok ? `saved ${j.saved} joints → ${j.path}` : `save failed: ${JSON.stringify(j)}`;
  } catch (e) { statusEl.textContent = 'save error: ' + e.message; }
};

buildBtn.onclick = async () => {
  statusEl.textContent = 'building…';
  logEl.hidden = false;
  logEl.textContent = '';
  try {
    const r = await fetch('/api/rig/build', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
    });
    const j = await r.json();
    if (!j.ok) { statusEl.textContent = 'build failed: ' + JSON.stringify(j); return; }
    statusEl.textContent = `building (pid ${j.pid}) → ${j.dest}`;
    pollBuild();
  } catch (e) { statusEl.textContent = 'build error: ' + e.message; }
};

async function pollBuild() {
  for (let i = 0; i < 120; i++) {
    await new Promise(r => setTimeout(r, 3000));
    try {
      const s = await (await fetch('/api/rig/build/status')).json();
      logEl.textContent = s.log || '';
      logEl.scrollTop = logEl.scrollHeight;
      if (/wrote |done:|Traceback/.test(s.log || '')) {
        statusEl.textContent = /Traceback/.test(s.log) ? 'build errored — see log' : 'build finished';
        return;
      }
    } catch (e) { /* keep polling */ }
  }
  statusEl.textContent = 'build still running — check the log';
}

// ── boot ────────────────────────────────────────────────────────────────
(async () => {
  try {
    const cur = await (await fetch('/api/rig/joints')).json();
    Object.assign(state, cur.joints || {});
  } catch (e) { /* first run */ }
  armed = JOINTS.find(([n]) => !state[n])?.[0] || null;
  renderList();
  updateHint();
  resize();
  if (Object.keys(state).length) {
    // markers need the model; refresh once it lands
    const t = setInterval(() => { if (model) { refreshMarkers(); clearInterval(t); } }, 200);
  }
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
})();
</script>
</body>
</html>
